---
# Grype configuration file for container vulnerability scanning
# https://oss.anchore.com/docs/reference/grype/configuration/

ignore:
  # ============================================================================
  # nginx CVEs (nginx 1.29.2 bundled in OpenResty 1.29.2.5)
  # Fixed in nginx 1.29.7 / 1.30.1+ / 1.30.3+ / 1.30.6 depending on CVE.
  # No OpenResty alpine-fat image with a patched nginx on the 1.29.2.x track is available.
  # ============================================================================
  - vulnerability: CVE-2026-15176
    # Fixed in nginx 1.30.6. No OpenResty alpine-fat image is available with a patched nginx on the 1.29.2.x track.
  - vulnerability: CVE-2026-97629
    # Fixed in nginx 1.30.6. No OpenResty alpine-fat image is available with a patched nginx on the 1.29.2.x track.
  - vulnerability: CVE-2026-42945
    # Fixed in nginx 1.30.1/1.31.0+, but no OpenResty alpine-fat image is available with a patched nginx on the 1.29.2.x track.
    # Not exploitable: the vulnerability requires rewrite directives with unnamed PCRE captures, which are not used in this config.
  - vulnerability: CVE-2026-42946
    # Not exploitable: neither scgi_pass nor uwsgi_pass is configured.
  - vulnerability: CVE-2026-27654
    # Not exploitable: DAV module directives and alias are not used in this config.
  - vulnerability: CVE-2026-27651
    # Not exploitable: this is an HTTP proxy, not a mail server; the mail module is not used.
  - vulnerability: CVE-2026-32647
    # Not exploitable: the mp4 directive is not used in this config.
  - vulnerability: CVE-2026-27784
    # Not exploitable: mp4 directive is absent and this image runs 64-bit (linux/amd64).
  - vulnerability: CVE-2026-1642
    # Not exploitable: both proxy_pass directives use http:// (plain HTTP to internal upstream).
  - vulnerability: CVE-2026-34182
    # Not exploitable: nginx does not use OpenSSL CMS functions.
  - vulnerability: CVE-2026-45447
    # Not exploitable: nginx does not perform PKCS#7 signature verification.
  - vulnerability: CVE-2026-42764
    # Not exploitable: QUIC is not configured (no listen ... quic directives).
  - vulnerability: CVE-2026-34183
    # Not exploitable: QUIC is not configured.
  - vulnerability: CVE-2026-34180
    # Not exploitable: nginx TLS certificate and message data is orders of magnitude below 2GB.
  - vulnerability: CVE-2026-7383
    # Not exploitable: X.509 certificate processing in nginx does not exercise this code path.
  - vulnerability: CVE-2026-45445
    # Not exploitable: nginx uses OpenSSL only via the TLS stack.
  - vulnerability: CVE-2026-9076
    # Not exploitable: nginx does not use OpenSSL CMS password-based decryption.
  - vulnerability: CVE-2026-34181
    # Not exploitable: nginx does not process PKCS#12 files at runtime.
  # ============================================================================
  # libxml2 2.13.9-r0 in Alpine base image; fixed in 2.13.9-r1.
  # Accepted: libxml2 is not directly invoked by nginx or lua-resty-openidc in this deployment.
  # ============================================================================
  # nginx core CVEs (nginx 1.29.2 bundled in OpenResty 1.29.2.5)
  # Fixed in nginx 1.30.4 / 1.31.3. No OpenResty release bundles a patched
  # nginx core yet (current lines: 1.29.2.5 -> nginx 1.29.2, 1.31.1.1 -> nginx
  # 1.31.1, as of 2026-07-21). Tracked upstream:
  # https://github.com/openresty/openresty/issues/1136
  # ============================================================================
  - vulnerability: CVE-2026-42533
    # No fix available on any OpenResty release line. Fixed upstream in nginx
    # 1.30.4/1.31.3 (nginx.org/en/security_advisories.html).
  - vulnerability: CVE-2026-60005
    # No fix available on any OpenResty release line. Fixed upstream in nginx
    # 1.30.4/1.31.3.
  - vulnerability: CVE-2026-56434
    # No fix available on any OpenResty release line. Fixed upstream in nginx
    # 1.30.4/1.31.3.
  - vulnerability: CVE-2026-14456
    # Low severity: unbounded memory growth in OpenSSL's QUIC *server* listener
    # (pending-connection queue) when SSL_accept() isn't called fast enough.
    # Fixed in OpenSSL 3.5.8, but that release has not shipped yet (advisory
    # published 2026-08-13; https://openssl-library.org/news/secadv/20260813.txt)
  - vulnerability: CVE-2026-14457
    # libcrypto3/libssl3 3.5.6-r0 in Alpine base image; fixed in 3.5.8-r0.
    # Fix not yet available on the OpenResty 1.29.2.5-1-alpine-fat image line.
  - vulnerability: CVE-2026-18798
    # libcrypto3/libssl3 3.5.6-r0 in Alpine base image; fixed in 3.5.8-r0.
    # Fix not yet available on the OpenResty 1.29.2.5-1-alpine-fat image line.
  - vulnerability: CVE-2026-54874
    # libcrypto3/libssl3 3.5.6-r0 in Alpine base image; fixed in 3.5.8-r0.
    # Fix not yet available on the OpenResty 1.29.2.5-1-alpine-fat image line.
  - vulnerability: CVE-2026-63072
    # libcrypto3/libssl3 3.5.6-r0 in Alpine base image; fixed in 3.5.8-r0.
    # Fix not yet available on the OpenResty 1.29.2.5-1-alpine-fat image line.
  - vulnerability: CVE-2026-63075
    # libcrypto3/libssl3 3.5.6-r0 in Alpine base image; fixed in 3.5.8-r0.
    # Fix not yet available on the OpenResty 1.29.2.5-1-alpine-fat image line.
  - vulnerability: CVE-2026-63076
    # libcrypto3/libssl3 3.5.6-r0 in Alpine base image; fixed in 3.5.8-r0.
    # Fix not yet available on the OpenResty 1.29.2.5-1-alpine-fat image line.
  - vulnerability: CVE-2026-63073
    # libcrypto3/libssl3 3.5.6-r0 in Alpine base image; fixed in 3.5.8-r0.
    # Fix not yet available on the OpenResty 1.29.2.5-1-alpine-fat image line.
  - vulnerability: CVE-2026-75803
    # libcrypto3/libssl3 3.5.6-r0 in Alpine base image; fixed in 3.5.8-r0.
  # ============================================================================
  # OpenSSL 3.5.6 compiled into OpenResty (/usr/local/openresty/openssl3)
  # This is OpenResty's own source-built OpenSSL, not the Alpine libssl3 package,
  # so `apk upgrade` cannot patch it. Fixed upstream in OpenSSL 3.5.8, but no
  # OpenResty 1.29.2.5-x-alpine-fat image ships a patched bundled OpenSSL yet.
  # Re-check on the next OpenResty base image bump.
  # ============================================================================
  - vulnerability: CVE-2026-54873
    package:
      location: "/usr/local/openresty/openssl3/**"
  - vulnerability: CVE-2026-84782
    package:
      location: "/usr/local/openresty/openssl3/**"
  - vulnerability: CVE-2026-84784
    package:
      location: "/usr/local/openresty/openssl3/**"
  - vulnerability: CVE-2026-72897
    package:
      location: "/usr/local/openresty/openssl3/**"
  # OpenSSL 3.5.6 bundled in OpenResty: findings fixed upstream in OpenSSL 3.5.10.
  # As above, apk cannot patch this copy. Remove these ignores once the base
  # image ships a bundled OpenSSL >= 3.5.10.
  - vulnerability: CVE-2026-95691
    package:
      location: "/usr/local/openresty/openssl3/**"
  - vulnerability: CVE-2026-95692
    package:
      location: "/usr/local/openresty/openssl3/**"
  - vulnerability: CVE-2026-88823
    package:
      location: "/usr/local/openresty/openssl3/**"
  - vulnerability: CVE-2026-107496
    # Grype reports the fix as 1.0.2zt, which is the legacy 1.0.2 branch and does
    # not apply to 3.5.x. Confirm the 3.5.x fix version against the OpenSSL advisory.
    package:
      location: "/usr/local/openresty/openssl3/**"
  # ============================================================================
  # nginx November 2026 security release (nginx 1.29.2 bundled in OpenResty 1.29.2.5)
  # Fixed upstream in nginx 1.30.7 / 1.31.9 (released 2026-11-18). No OpenResty
  # release bundles either yet: latest is 1.31.8.1 -> nginx 1.31.8, still vulnerable.
  # Re-check when OpenResty ships a release based on nginx >= 1.31.9.
  # ============================================================================
  - vulnerability: CVE-2026-123007
    # Not exploitable: HTTP/2 flow-control bug; HTTP/2 is not enabled (no `http2 on` / `listen ... http2`).
  - vulnerability: CVE-2026-123633
    # Not exploitable: HTTP/2 use-after-free; HTTP/2 is not enabled.
  - vulnerability: CVE-2026-123634
    # Not exploitable: resolver use-after-free requires a variable-based proxy_pass plus a
    # mirror/SSI subrequest resolving the same name; neither mirror nor SSI is used and
    # proxy_pass targets are fixed.
  - vulnerability: CVE-2026-121810
    # Not exploitable: HTTP/3 use-after-free; QUIC is not configured (no listen ... quic).
  - vulnerability: CVE-2026-113425
    # Not exploitable: mail proxy use-after-free; this is an HTTP proxy, the mail module is not used.
